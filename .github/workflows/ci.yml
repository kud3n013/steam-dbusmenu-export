name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPS: base-devel git glib2 libdbusmenu-glib libx11 pkgconf clang xorg-server-xvfb dbus shellcheck namcap

jobs:
  build-test:
    name: build-test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (-Wall -Wextra, warnings are not fatal)
        run: make CC=${{ matrix.cc }} CFLAGS='-Wall -Wextra'
      - name: Test
        run: make CC=${{ matrix.cc }} CFLAGS='-Wall -Wextra' test
      - name: Headless run stability (10 runs)
        run: for i in $(seq 10); do make CC=${{ matrix.cc }} test >/dev/null || exit 1; done

  lint:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          shellcheck $(git ls-files '*.sh')

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare source tarball and build user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' src/steam-globalmenu.c)
          git archive --prefix="steam-dbusmenu-export-${version}/" -o "packaging/arch/steam-dbusmenu-export-${version}.tar.gz" HEAD
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE/packaging/arch"
      - name: makepkg (unprivileged, no sudo)
        run: su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"
      - name: namcap
        working-directory: packaging/arch
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
      - name: Verify package contents
        working-directory: packaging/arch
        run: |
          tar --zstd -tf ./*.pkg.tar.zst | grep -v '^\.' | grep -v '/$' | sort > files.txt
          cat files.txt
          printf '%s\n' usr/bin/steam-globalmenu usr/lib/systemd/user/steam-globalmenu.service \
            usr/share/doc/steam-globalmenu/quickcss.css usr/share/licenses/steam-globalmenu/LICENSE | sort | diff - files.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
